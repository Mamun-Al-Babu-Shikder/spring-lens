<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Spring Lens - Beans</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="style.css">
    <script src="./src/lib/jquery-3.6.0.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#6b46c1',
                        'primary-light': '#f3f0ff',
                        'gray-50': '#f8fafc',
                        'gray-100': '#f1f5f9',
                        'gray-200': '#e2e8f0',
                        'gray-400': '#94a3b8',
                        'gray-500': '#64748b',
                        'gray-800': '#1e293b',
                        success: '#22c55e',
                        'success-light': '#dcfce7',
                        warning: '#f59e0b',
                        info: '#3b82f6',
                    }
                }
            }
        }
    </script>
    <script>
            (function () {
                const savedTheme = localStorage.getItem('theme');
                const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            })();
    </script>
</head>

<body
    class="bg-gray-50 dark:bg-slate-950 text-gray-800 dark:text-gray-100 font-sans antialiased h-screen flex overflow-hidden transition-colors duration-300">

    <!-- Sidebar -->
    <aside
        class="w-64 bg-white dark:bg-slate-900 border-r border-gray-200 dark:border-slate-800 flex flex-col h-full flex-shrink-0 transition-colors duration-300 select-none">
        <!-- Sidebar Brand Header -->
        <div class="p-5 flex items-center justify-between gap-3 border-b border-gray-100 dark:border-slate-800/80">
            <div class="flex items-center gap-3 min-w-0">
                <div
                    class="w-9 h-9 bg-gradient-to-br from-primary via-purple-600 to-indigo-600 rounded-xl flex items-center justify-center text-white shadow-md shadow-primary/20 flex-shrink-0 border border-white/20">
                    <span class="material-symbols-outlined text-[20px]">layers</span>
                </div>
                <div class="min-w-0">
                    <h1 class="font-bold text-base tracking-tight text-gray-900 dark:text-white leading-none">
                        <a href="#/dashboard" class="hover:text-primary dark:hover:text-purple-300 transition-colors">SpringLens</a>
                    </h1>
                    <div class="flex items-center gap-1.5 mt-1">
                        <span class="px-1.5 py-0.5 text-[9px] font-mono font-bold bg-primary/10 text-primary dark:text-purple-300 rounded border border-primary/20">v1.0.0</span>
                        <span class="text-[10px] text-gray-400 dark:text-gray-500 font-medium">Observability</span>
                    </div>
                </div>
            </div>
            <button id="theme-toggle"
                class="w-8 h-8 flex items-center justify-center border border-gray-200 dark:border-slate-700 rounded-xl text-gray-500 dark:text-gray-400 hover:text-gray-800 dark:hover:text-gray-100 hover:bg-gray-100 dark:hover:bg-slate-800 bg-white dark:bg-slate-900 shadow-xs transition-all cursor-pointer flex-shrink-0"
                aria-label="Toggle theme" title="Toggle dark/light theme">
                <span class="material-symbols-outlined text-[18px] dark:hidden">dark_mode</span>
                <span class="material-symbols-outlined text-[18px] hidden dark:inline">light_mode</span>
            </button>
        </div>

        <!-- Navigation Links Container -->
        <div class="flex-1 overflow-y-auto custom-scrollbar px-3 py-4 space-y-6">
            <!-- Main Navigation -->
            <div>
                <div class="px-3 pb-2 text-[10px] font-bold text-gray-400 dark:text-gray-500 uppercase tracking-wider">
                    Core Platform
                </div>
                <nav class="space-y-1">
                    <a data-page="dashboard" href="#/dashboard"
                        class="flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:text-gray-900 hover:bg-gray-100/70 dark:text-gray-400 dark:hover:text-gray-100 dark:hover:bg-slate-800/60 rounded-xl text-xs font-semibold transition-all nav-link group">
                        <div class="w-7 h-7 rounded-lg bg-gray-100 dark:bg-slate-800 flex items-center justify-center text-gray-500 dark:text-gray-400 group-hover:text-primary dark:group-hover:text-purple-300 transition-colors flex-shrink-0">
                            <span class="material-symbols-outlined text-[18px]">dashboard</span>
                        </div>
                        <span>Dashboard</span>
                    </a>
                </nav>
            </div>

            <!-- Beans Navigation -->
            <div>
                <div class="px-3 pb-2 text-[10px] font-bold text-gray-400 dark:text-gray-500 uppercase tracking-wider">
                    Bean Ecosystem
                </div>
                <nav class="space-y-1">
                    <div class="menu-group">
                        <a data-page="definitions" href="#/definitions"
                            class="flex items-center justify-between px-3 py-2.5 text-gray-600 hover:text-gray-900 hover:bg-gray-100/70 dark:text-gray-400 dark:hover:text-gray-100 dark:hover:bg-slate-800/60 rounded-xl text-xs font-semibold transition-all nav-link parent-link group">
                            <div class="flex items-center gap-3">
                                <div class="w-7 h-7 rounded-lg bg-purple-50 dark:bg-purple-950/40 text-primary dark:text-purple-300 flex items-center justify-center border border-primary/10 flex-shrink-0">
                                    <span class="material-symbols-outlined text-[18px]">widgets</span>
                                </div>
                                <span>Bean Engine</span>
                            </div>
                            <span
                                class="material-symbols-outlined text-[18px] transition-transform duration-200 chevron-icon text-gray-400">expand_more</span>
                        </a>
                        <div class="submenu ml-4 pl-3 border-l border-gray-100 dark:border-slate-800/80 space-y-1 mt-1.5 hidden">
                            <a data-page="definitions" href="#/definitions"
                                class="flex items-center gap-2.5 text-xs font-medium text-gray-600 hover:text-gray-900 dark:text-gray-400 dark:hover:text-gray-100 py-2 px-2.5 rounded-lg hover:bg-gray-100/70 dark:hover:bg-slate-800/60 transition-all nav-link group">
                                <span
                                    class="material-symbols-outlined text-[17px] text-gray-400 dark:text-gray-500 group-hover:text-primary dark:group-hover:text-purple-300 transition-colors">list_alt</span>
                                <span>Definitions</span>
                            </a>
                            <a data-page="timeline" href="#/timeline"
                                class="flex items-center gap-2.5 text-xs font-medium text-gray-600 hover:text-gray-900 dark:text-gray-400 dark:hover:text-gray-100 py-2 px-2.5 rounded-lg hover:bg-gray-100/70 dark:hover:bg-slate-800/60 transition-all nav-link group">
                                <span
                                    class="material-symbols-outlined text-[17px] text-gray-400 dark:text-gray-500 group-hover:text-primary dark:group-hover:text-purple-300 transition-colors">timelapse</span>
                                <span>Instances</span>
                            </a>
                            <a data-page="conditions" href="#/conditions"
                                class="flex items-center gap-2.5 text-xs font-medium text-gray-600 hover:text-gray-900 dark:text-gray-400 dark:hover:text-gray-100 py-2 px-2.5 rounded-lg hover:bg-gray-100/70 dark:hover:bg-slate-800/60 transition-all nav-link group">
                                <span
                                    class="material-symbols-outlined text-[17px] text-gray-400 dark:text-gray-500 group-hover:text-primary dark:group-hover:text-purple-300 transition-colors">fact_check</span>
                                <span>Condition Reports</span>
                            </a>
                            <a data-page="graph" href="#/graph"
                                class="flex items-center gap-2.5 text-xs font-medium text-gray-600 hover:text-gray-900 dark:text-gray-400 dark:hover:text-gray-100 py-2 px-2.5 rounded-lg hover:bg-gray-100/70 dark:hover:bg-slate-800/60 transition-all nav-link group">
                                <span
                                    class="material-symbols-outlined text-[17px] text-gray-400 dark:text-gray-500 group-hover:text-primary dark:group-hover:text-purple-300 transition-colors">hub</span>
                                <span>Dependency Graph</span>
                            </a>
                        </div>
                    </div>
                </nav>
            </div>
        </div>

        <!-- Sidebar Footer Status Card -->
        <div class="p-3 border-t border-gray-100 dark:border-slate-800/80 mt-auto bg-gray-50/50 dark:bg-slate-900/50">
            <div class="p-3 rounded-xl bg-white dark:bg-slate-800/60 border border-gray-200/80 dark:border-slate-700/60 shadow-xs flex items-center justify-between">
                <div class="flex items-center gap-2 min-w-0">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse flex-shrink-0"></span>
                    <div class="min-w-0">
                        <div class="text-[11px] font-bold text-gray-800 dark:text-gray-200 truncate">Connected</div>
                        <div class="text-[9px] text-gray-400 dark:text-gray-500 font-mono truncate">Spring Lens Agent</div>
                    </div>
                </div>
                <span class="px-1.5 py-0.5 rounded text-[9px] font-bold font-mono bg-emerald-50 text-emerald-600 dark:bg-emerald-950/40 dark:text-emerald-400 border border-emerald-200/60 dark:border-emerald-800/60">LIVE</span>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main id="main-content"
        class="flex-1 flex flex-col min-w-0 overflow-hidden bg-gray-50 dark:bg-slate-950 transition-colors duration-300">

    </main>

    <!-- Global App Templates -->
    <template id="tpl-app-loading">
        <div class="flex flex-col items-center justify-center h-full gap-3 py-24">
            <span class="animate-spin rounded-full h-10 w-10 border-4 border-primary border-t-transparent"></span>
            <span class="text-xs font-semibold text-gray-400 dark:text-gray-500">Loading module...</span>
        </div>
    </template>

    <template id="tpl-app-error">
        <div
            class="flex flex-col items-center justify-center h-full p-8 text-center bg-white dark:bg-slate-900 m-6 rounded-xl border border-gray-200 dark:border-slate-800 shadow-sm transition-colors duration-300">
            <span class="material-symbols-outlined text-red-500 text-5xl mb-4">error</span>
            <h3 class="text-lg font-bold text-gray-800 dark:text-white mb-1">Application Error</h3>
            <p class="text-sm text-gray-500 dark:text-gray-400 max-w-sm mb-2">Could not load this module. Please ensure
                the backend is active.</p>
            <p class="text-[10px] text-red-500 dark:text-red-400 font-mono mb-4 bg-red-50/50 dark:bg-red-950/20 border border-red-100 dark:border-red-900/30 rounded px-2 py-1 select-all"
                data-field="message"></p>
            <button id="retry-load-btn"
                class="px-4 py-2 bg-primary hover:bg-primary/95 text-white rounded-md text-sm font-semibold transition-colors">Retry</button>
        </div>
    </template>

    <template id="tpl-tooltip">
        <div id="tip"
            class="absolute hidden bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border border-gray-200/80 dark:border-slate-800 rounded-2xl p-3.5 shadow-2xl pointer-events-none z-50 text-xs min-w-[200px] max-w-[320px] transition-all duration-150">
            <div class="flex items-center gap-2 mb-2 pb-2 border-b border-gray-100 dark:border-slate-800/80">
                <div class="w-6 h-6 rounded-lg bg-primary/10 dark:bg-purple-950/40 text-primary dark:text-purple-300 flex items-center justify-center flex-shrink-0 border border-primary/20">
                    <span class="material-symbols-outlined text-[15px]">data_object</span>
                </div>
                <div id="tip-name" class="font-bold text-gray-900 dark:text-white font-mono text-[11.5px] truncate"></div>
            </div>
            <div class="space-y-1.5 text-[11px]">
                <div id="tip-type" class="text-gray-700 dark:text-gray-300 font-mono break-all leading-tight"></div>
                <div id="tip-scope" class="text-gray-500 dark:text-gray-400 font-medium"></div>
                <div id="tip-meta" class="text-primary dark:text-purple-300 font-semibold text-[10.5px]"></div>
            </div>
        </div>
    </template>

    <!-- Global Pagination Templates -->
    <template id="tpl-pagination-btn-nav">
        <button
            class="w-7 h-7 flex items-center justify-center rounded text-xs border border-gray-200 dark:border-slate-800 text-gray-500 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-slate-800 font-medium cursor-pointer">
            <span class="material-symbols-outlined text-[16px]"></span>
        </button>
    </template>

    <template id="tpl-pagination-btn-page">
        <button class="w-7 h-7 flex items-center justify-center rounded text-xs btn-page cursor-pointer"
            data-action="change-page"></button>
    </template>

    <template id="tpl-pagination-ellipsis">
        <span class="w-7 h-7 flex items-center justify-center text-xs text-gray-400 font-medium select-none">...</span>
    </template>

    <!-- Global Bean Details Sidebar Template -->
    <template id="tpl-bean-details-sidebar">
        <div class="flex flex-col h-full w-[360px]">
            <!-- Header -->
            <div class="p-4 border-b border-gray-100 dark:border-slate-800 flex items-center justify-between bg-gray-50/40 dark:bg-slate-800/20">
                <div class="flex items-center gap-2">
                    <h3 class="font-bold text-sm text-gray-800 dark:text-white">Bean Details</h3>
                    <span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-purple-50 text-primary border border-primary/20 dark:bg-purple-950/40 dark:text-purple-300">Inspector</span>
                </div>
                <button data-action="close-sidebar"
                    class="w-8 h-8 rounded-xl flex items-center justify-center text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 hover:bg-gray-100 dark:hover:bg-slate-800 transition-colors cursor-pointer"
                    id="btn-close-sidebar" title="Close sidebar">
                    <span class="material-symbols-outlined text-[18px]">close</span>
                </button>
            </div>

            <!-- Hero Section: Dynamic Icon Box, Name, Type, 2-Column Stats -->
            <div class="p-5 pb-4 border-b border-gray-100 dark:border-slate-800 bg-gray-50/30 dark:bg-slate-800/10">
                <div class="flex items-start gap-3 mb-3.5">
                    <div class="w-10 h-10 rounded-xl bg-amber-50 dark:bg-amber-950/30 text-amber-600 dark:text-amber-400 flex items-center justify-center border border-amber-200/60 dark:border-amber-900/40 shadow-xs flex-shrink-0 mt-0.5"
                        id="sidebar-icon-container">
                        <span class="material-symbols-outlined text-[20px]" id="sidebar-icon">schema</span>
                    </div>
                    <div class="min-w-0 flex-1 max-h-24 overflow-y-auto custom-scrollbar pr-1">
                        <div class="font-bold text-xs text-gray-800 dark:text-gray-100 break-words leading-tight"
                            id="detail-bean-name">-
                        </div>
                        <div class="text-[11px] text-gray-500 dark:text-gray-400 font-mono break-all leading-normal mt-1"
                            id="detail-bean-type">-</div>
                    </div>
                </div>

                <div
                    class="grid grid-cols-2 gap-2 bg-white dark:bg-slate-900 p-3 rounded-xl border border-gray-100 dark:border-slate-800 shadow-xs">
                    <div>
                        <div class="text-[9px] text-gray-400 dark:text-gray-500 font-bold uppercase tracking-wider mb-0.5">Scope</div>
                        <div class="text-xs font-mono font-bold text-gray-800 dark:text-gray-100 truncate" id="detail-bean-scope">
                            -
                        </div>
                    </div>
                    <div>
                        <div class="text-[9px] text-gray-400 dark:text-gray-500 font-bold uppercase tracking-wider mb-0.5">Role</div>
                        <div class="text-xs font-mono font-bold text-gray-800 dark:text-gray-100 truncate" id="detail-bean-role">
                            Application
                        </div>
                    </div>
                </div>
            </div>

            <!-- Sidebar Tabs -->
            <div class="flex border-b border-gray-100 dark:border-slate-800 px-2 bg-gray-50/20 dark:bg-slate-900/20" id="sidebar-tabs">
                <button data-action="switch-tab"
                    class="flex-1 py-2.5 text-xs font-bold text-primary dark:text-purple-400 border-b-2 border-primary text-center tab-btn cursor-pointer"
                    data-tab="properties" id="tab-properties">Properties</button>
                <button data-action="switch-tab"
                    class="flex-1 py-2.5 text-xs font-medium text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300 text-center tab-btn cursor-pointer"
                    data-tab="dependencies" id="tab-dependencies">Dependencies (<span
                        id="detail-deps-count">0</span>)</button>
                <button data-action="switch-tab"
                    class="flex-1 py-2.5 text-xs font-medium text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300 text-center tab-btn cursor-pointer"
                    data-tab="dependents" id="tab-dependents">Dependents (<span
                        id="detail-dependents-count">0</span>)</button>
            </div>

            <!-- Scrollable Content Area -->
            <div class="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-4" id="sidebar-content">
                <!-- Tab Pane: Properties -->
                <div id="pane-properties" class="tab-pane space-y-3.5">
                    <!-- Basic Info Section -->
                    <div class="p-3.5 rounded-xl border border-gray-100 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-xs space-y-2.5">
                        <h4 class="text-[11px] font-bold text-gray-800 dark:text-white uppercase tracking-wider">Basic Info</h4>
                        <div class="space-y-2 text-xs">
                            <div class="flex justify-between items-center py-0.5">
                                <span class="text-gray-500 dark:text-gray-400 font-medium">Primary Bean</span>
                                <span class="font-bold text-gray-800 dark:text-gray-200 font-mono text-[11px]"
                                    id="detail-prop-primary">FALSE</span>
                            </div>
                            <div class="flex justify-between items-center py-0.5">
                                <span class="text-gray-500 dark:text-gray-400 font-medium">Lazy Initialized</span>
                                <span class="font-bold text-gray-800 dark:text-gray-200 font-mono text-[11px]"
                                    id="detail-prop-lazy">FALSE</span>
                            </div>
                            <div class="flex justify-between items-center py-0.5">
                                <span class="text-gray-500 dark:text-gray-400 font-medium">Autowired Candidate</span>
                                <span class="font-bold text-gray-800 dark:text-gray-200 font-mono text-[11px]"
                                    id="detail-prop-autowired">TRUE</span>
                            </div>
                            <div class="flex justify-between items-center py-0.5">
                                <span class="text-gray-500 dark:text-gray-400 font-medium">Context ID</span>
                                <span class="font-bold text-gray-800 dark:text-gray-200 font-mono text-[11px] truncate max-w-[160px]"
                                    id="detail-prop-context">-</span>
                            </div>
                        </div>
                    </div>

                    <!-- Factory Details Section -->
                    <div class="p-3.5 rounded-xl border border-gray-100 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-xs space-y-2.5">
                        <h4 class="text-[11px] font-bold text-gray-800 dark:text-white uppercase tracking-wider">Factory Details</h4>
                        <div class="space-y-2 text-xs">
                            <div>
                                <span class="text-[10px] text-gray-400 dark:text-gray-500 font-bold uppercase tracking-wider block mb-0.5">Factory Bean</span>
                                <span class="text-[11px] font-mono font-medium text-gray-800 dark:text-gray-200 break-all leading-normal"
                                    id="detail-factory-bean">-</span>
                            </div>
                            <div class="pt-1.5 border-t border-gray-100 dark:border-slate-800">
                                <span class="text-[10px] text-gray-400 dark:text-gray-500 font-bold uppercase tracking-wider block mb-0.5">Factory Method</span>
                                <span class="text-xs font-mono font-bold text-gray-800 dark:text-gray-200 break-all"
                                    id="detail-factory-method">-</span>
                            </div>
                        </div>
                    </div>

                    <!-- Lifecycle Section -->
                    <div class="p-3.5 rounded-xl border border-gray-100 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-xs space-y-2.5">
                        <h4 class="text-[11px] font-bold text-gray-800 dark:text-white uppercase tracking-wider">Lifecycle</h4>
                        <div class="space-y-2 text-xs">
                            <div class="flex justify-between items-center py-0.5">
                                <span class="text-gray-500 dark:text-gray-400 font-medium">Init Method</span>
                                <span class="font-bold text-gray-800 dark:text-gray-200 font-mono text-[11px]"
                                    id="detail-init-method">-</span>
                            </div>
                            <div class="flex justify-between items-center py-0.5">
                                <span class="text-gray-500 dark:text-gray-400 font-medium">Destroy Method</span>
                                <span class="font-bold text-gray-800 dark:text-gray-200 font-mono text-[11px]"
                                    id="detail-destroy-method">-</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Tab Pane: Dependencies -->
                <div id="pane-dependencies" class="tab-pane hidden space-y-2">
                    <div id="detail-deps-list" class="space-y-1.5 text-xs">
                        <!-- Dynamically populated -->
                    </div>
                </div>

                <!-- Tab Pane: Dependents -->
                <div id="pane-dependents" class="tab-pane hidden space-y-2">
                    <div id="detail-dependents-list" class="space-y-1.5 text-xs">
                        <!-- Dynamically populated -->
                    </div>
                </div>
            </div>

            <!-- Optional Footer Container -->
            <div id="sidebar-footer-container"></div>
        </div>
    </template>

    <script src="./src/lib/d3.v7.min.js"></script>
    <script src="./src/lib/chart-4.5.1.min.js"></script>
    <script type="module" src="./script.js"></script>
</body>

</html>
