<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Spring Lens - Beans</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="style.css">
    <script src="./src/lib/jquery-3.6.0.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#6b46c1',
                        'primary-light': '#f3f0ff',
                        'gray-50': '#f8fafc',
                        'gray-100': '#f1f5f9',
                        'gray-200': '#e2e8f0',
                        'gray-400': '#94a3b8',
                        'gray-500': '#64748b',
                        'gray-800': '#1e293b',
                        success: '#22c55e',
                        'success-light': '#dcfce7',
                        warning: '#f59e0b',
                        info: '#3b82f6',
                    }
                }
            }
        }
    </script>
    <script>
            (function () {
                const savedTheme = localStorage.getItem('theme');
                const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            })();
    </script>
</head>

<body
    class="bg-gray-50 dark:bg-slate-950 text-gray-800 dark:text-gray-100 font-sans antialiased h-screen flex overflow-hidden transition-colors duration-300">

    <!-- Sidebar -->
    <aside
        class="w-64 bg-white dark:bg-slate-900 border-r border-gray-200 dark:border-slate-800 flex flex-col h-full flex-shrink-0 transition-colors duration-300">
        <div class="p-5 flex items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div
                    class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center text-white shadow-md flex-shrink-0">
                    <span class="material-symbols-outlined text-[20px]">layers</span>
                </div>
                <h1 class="font-bold text-lg tracking-tight text-gray-850 dark:text-white"><a href="#/dashboard">Spring
                        Lens</a></h1>
            </div>
            <button id="theme-toggle"
                class="w-8 h-8 flex items-center justify-center border border-gray-200 dark:border-slate-700 rounded-md text-gray-500 dark:text-gray-400 hover:text-gray-800 dark:hover:text-gray-200 hover:bg-gray-50 dark:hover:bg-slate-800 bg-white dark:bg-slate-900 shadow-sm transition-colors cursor-pointer"
                aria-label="Toggle theme">
                <span class="material-symbols-outlined text-[18px] dark:hidden">dark_mode</span>
                <span class="material-symbols-outlined text-[18px] hidden dark:inline">light_mode</span>
            </button>
        </div>

        <div class="flex-1 overflow-y-auto custom-scrollbar px-3 pb-4">
            <nav class="space-y-0.5">
                <a data-page="dashboard" href="#/dashboard"
                    class="flex items-center gap-3 px-3 py-2 text-gray-500 hover:text-gray-800 hover:bg-gray-50 dark:text-gray-400 dark:hover:text-gray-100 dark:hover:bg-gray-700 rounded-md text-sm font-medium transition-colors nav-link">
                    <span class="material-symbols-outlined text-[20px]">dashboard</span> Dashboard
                </a>
                <!--<div class="menu-group pt-2">
                    <a data-page="request" href="#/request"
                        class="flex items-center justify-between px-3 py-2 text-gray-500 hover:text-gray-800 hover:bg-gray-50 dark:text-gray-400 dark:hover:text-gray-100 dark:hover:bg-gray-700 rounded-md text-sm font-medium transition-colors nav-link parent-link">
                        <div class="flex items-center gap-3">
                            <span class="material-symbols-outlined text-[20px]">compare_arrows</span> Http Insight
                        </div>
                        <span
                            class="material-symbols-outlined text-[18px] transition-transform duration-200 chevron-icon">expand_more</span>
                    </a>
                    <div class="submenu ml-10 space-y-1 mt-1 hidden">
                        <a data-page="request" href="#/request"
                            class="block text-xs font-medium text-gray-500 hover:text-gray-800 dark:text-gray-400 dark:hover:text-gray-100 py-1 nav-link">Requests</a>
                        <a data-page="request-endpoint" href="#/request-endpoint"
                            class="block text-xs font-medium text-gray-500 hover:text-gray-800 dark:text-gray-400 dark:hover:text-gray-100 py-1 nav-link">Endpoints</a>
                    </div>
                </div>-->
                <div class="menu-group pt-2">
                    <a data-page="definitions" href="#/definitions"
                        class="flex items-center justify-between px-3 py-2 text-gray-500 hover:text-gray-800 hover:bg-gray-50 dark:text-gray-400 dark:hover:text-gray-100 dark:hover:bg-gray-700 rounded-md text-sm font-medium transition-colors nav-link parent-link">
                        <div class="flex items-center gap-3">
                            <span class="material-symbols-outlined text-[25px]">eco</span> Bean
                        </div>
                        <span
                            class="material-symbols-outlined text-[18px] transition-transform duration-200 chevron-icon">expand_more</span>
                    </a>
                    <div class="submenu ml-8 space-y-1 mt-1 hidden">
                        <a data-page="definitions" href="#/definitions"
                            class="flex items-center gap-2 text-xs font-medium text-gray-500 hover:text-gray-800 dark:text-gray-400 dark:hover:text-gray-100 py-1.5 px-2 rounded-md hover:bg-gray-50 dark:hover:bg-slate-800/60 nav-link">
                            <span
                                class="material-symbols-outlined text-[18px] text-gray-400 dark:text-gray-500">list_alt</span>
                            <span>Definitions</span>
                        </a>
                        <a data-page="timeline" href="#/timeline"
                            class="flex items-center gap-2 text-xs font-medium text-gray-500 hover:text-gray-800 dark:text-gray-400 dark:hover:text-gray-100 py-1.5 px-2 rounded-md hover:bg-gray-50 dark:hover:bg-slate-800/60 nav-link">
                            <span
                                class="material-symbols-outlined text-[18px] text-gray-400 dark:text-gray-500">timelapse</span>
                            <span>Instances</span>
                        </a>
                        <a data-page="conditions" href="#/conditions"
                            class="flex items-center gap-2 text-xs font-medium text-gray-500 hover:text-gray-800 dark:text-gray-400 dark:hover:text-gray-100 py-1.5 px-2 rounded-md hover:bg-gray-50 dark:hover:bg-slate-800/60 nav-link">
                            <span
                                class="material-symbols-outlined text-[18px] text-gray-400 dark:text-gray-500">rule</span>
                            <span>Condition Reports</span>
                        </a>
                        <a data-page="graph" href="#/graph"
                            class="flex items-center gap-2 text-xs font-medium text-gray-500 hover:text-gray-800 dark:text-gray-400 dark:hover:text-gray-100 py-1.5 px-2 rounded-md hover:bg-gray-50 dark:hover:bg-slate-800/60 nav-link">
                            <span
                                class="material-symbols-outlined text-[18px] text-gray-400 dark:text-gray-500">account_tree</span>
                            <span>Dependency Graph</span>
                        </a>
                    </div>
                </div>
            </nav>
        </div>
    </aside>

    <!-- Main Content -->
    <main id="main-content"
        class="flex-1 flex flex-col min-w-0 overflow-hidden bg-gray-50 dark:bg-slate-950 transition-colors duration-300">

    </main>

    <!-- Global App Templates -->
    <template id="tpl-app-loading">
        <div class="flex flex-col items-center justify-center h-full gap-3 py-24">
            <span class="animate-spin rounded-full h-10 w-10 border-4 border-primary border-t-transparent"></span>
            <span class="text-xs font-semibold text-gray-400 dark:text-gray-500">Loading module...</span>
        </div>
    </template>

    <template id="tpl-app-error">
        <div
            class="flex flex-col items-center justify-center h-full p-8 text-center bg-white dark:bg-slate-900 m-6 rounded-xl border border-gray-200 dark:border-slate-800 shadow-sm transition-colors duration-300">
            <span class="material-symbols-outlined text-red-500 text-5xl mb-4">error</span>
            <h3 class="text-lg font-bold text-gray-800 dark:text-white mb-1">Application Error</h3>
            <p class="text-sm text-gray-500 dark:text-gray-400 max-w-sm mb-2">Could not load this module. Please ensure
                the backend is active.</p>
            <p class="text-[10px] text-red-500 dark:text-red-400 font-mono mb-4 bg-red-50/50 dark:bg-red-950/20 border border-red-100 dark:border-red-900/30 rounded px-2 py-1 select-all"
                data-field="message"></p>
            <button id="retry-load-btn"
                class="px-4 py-2 bg-primary hover:bg-primary/95 text-white rounded-md text-sm font-semibold transition-colors">Retry</button>
        </div>
    </template>

    <template id="tpl-tooltip">
        <div id="tip"
            class="absolute hidden bg-white/95 dark:bg-gray-800/95 backdrop-blur-sm border border-gray-200 dark:border-gray-700 rounded-xl p-3 shadow-lg pointer-events-none z-50 text-xs text-gray-600 dark:text-gray-300 min-w-[150px] transition-opacity duration-150">
            <div id="tip-name" class="font-bold text-gray-800 dark:text-white mb-1 font-mono text-[11px]"></div>
            <div id="tip-type" class="text-[10px] text-gray-500 mb-0.5"></div>
            <div id="tip-scope" class="text-[10px] text-gray-500 mb-0.5"></div>
            <div id="tip-meta" class="text-[10px] text-gray-500"></div>
        </div>
    </template>

    <!-- Global Pagination Templates -->
    <template id="tpl-pagination-btn-nav">
        <button
            class="w-7 h-7 flex items-center justify-center rounded text-xs border border-gray-200 dark:border-slate-800 text-gray-500 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-slate-800 font-medium cursor-pointer">
            <span class="material-symbols-outlined text-[16px]"></span>
        </button>
    </template>

    <template id="tpl-pagination-btn-page">
        <button class="w-7 h-7 flex items-center justify-center rounded text-xs btn-page cursor-pointer"
            data-action="change-page"></button>
    </template>

    <template id="tpl-pagination-ellipsis">
        <span class="w-7 h-7 flex items-center justify-center text-xs text-gray-400 font-medium select-none">...</span>
    </template>

    <!-- Global Bean Details Sidebar Template -->
    <template id="tpl-bean-details-sidebar">
        <div class="flex flex-col h-full">
            <!-- Header -->
            <div class="p-4 border-b border-gray-100 dark:border-slate-800 flex items-center justify-between">
                <h3 class="font-bold text-sm text-gray-800 dark:text-white">Bean Details</h3>
                <button data-action="close-sidebar"
                    class="text-gray-400 dark:text-gray-500 hover:text-gray-600 dark:hover:text-gray-300 cursor-pointer"
                    id="btn-close-sidebar">
                    <span class="material-symbols-outlined text-[18px]">close</span>
                </button>
            </div>

            <!-- Hero Section: Yellow Icon Box, Name, Type, 3-Column Stats -->
            <div class="p-4 pb-3 border-b border-gray-100 dark:border-slate-800 bg-gray-50/30 dark:bg-slate-800/10">
                <div class="flex items-start gap-3 mb-3">
                    <div class="w-9 h-9 rounded-lg bg-amber-50 dark:bg-amber-950/30 text-amber-600 dark:text-amber-400 flex items-center justify-center border border-amber-200/60 dark:border-amber-900/40 shadow-sm flex-shrink-0 mt-0.5"
                        id="sidebar-icon-container">
                        <span class="material-symbols-outlined text-[20px]" id="sidebar-icon">schema</span>
                    </div>
                    <div class="min-w-0 flex-1 max-h-24 overflow-y-auto custom-scrollbar pr-1">
                        <div class="font-bold text-xs text-gray-800 dark:text-gray-100 break-words leading-tight"
                            id="detail-bean-name">-
                        </div>
                        <div class="text-[11px] text-gray-500 dark:text-gray-400 font-mono break-all leading-normal mt-1"
                            id="detail-bean-type">-</div>
                    </div>
                </div>

                <div
                    class="grid grid-cols-3 gap-1.5 bg-white dark:bg-slate-900 p-2.5 rounded-lg border border-gray-100 dark:border-slate-800 shadow-sm">
                    <div>
                        <div class="text-[10px] text-gray-400 dark:text-gray-500 font-medium mb-0.5">Scope</div>
                        <div class="text-xs font-bold text-gray-800 dark:text-gray-100 truncate" id="detail-bean-scope">
                            -
                        </div>
                    </div>
                    <div>
                        <div class="text-[10px] text-gray-400 dark:text-gray-500 font-medium mb-0.5">Role</div>
                        <div class="text-xs font-bold text-gray-800 dark:text-gray-100 truncate" id="detail-bean-role">
                            Application
                        </div>
                    </div>
                </div>
            </div>

            <!-- Sidebar Tabs -->
            <div class="flex border-b border-gray-100 dark:border-slate-800 px-1" id="sidebar-tabs">
                <button data-action="switch-tab"
                    class="flex-1 py-2.5 text-xs font-bold text-primary dark:text-purple-400 border-b-2 border-primary text-center tab-btn cursor-pointer"
                    data-tab="properties" id="tab-properties">Properties</button>
                <button data-action="switch-tab"
                    class="flex-1 py-2.5 text-xs font-medium text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300 text-center tab-btn cursor-pointer"
                    data-tab="dependencies" id="tab-dependencies">Dependencies (<span
                        id="detail-deps-count">0</span>)</button>
                <button data-action="switch-tab"
                    class="flex-1 py-2.5 text-xs font-medium text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300 text-center tab-btn cursor-pointer"
                    data-tab="dependents" id="tab-dependents">Dependents (<span
                        id="detail-dependents-count">0</span>)</button>
            </div>

            <!-- Scrollable Content Area -->
            <div class="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-4" id="sidebar-content">
                <!-- Tab Pane: Properties -->
                <div id="pane-properties" class="tab-pane space-y-4">
                    <!-- Basic Info Section -->
                    <div>
                        <h4 class="text-[11px] font-bold text-gray-800 dark:text-white mb-2">Basic Info</h4>
                        <div class="space-y-2">
                            <div class="flex justify-between items-center text-xs">
                                <span class="text-gray-500 dark:text-gray-400">Primary Bean</span>
                                <span class="font-bold text-gray-800 dark:text-gray-200"
                                    id="detail-prop-primary">FALSE</span>
                            </div>
                            <div class="flex justify-between items-center text-xs">
                                <span class="text-gray-500 dark:text-gray-400">Lazy Initialized</span>
                                <span class="font-bold text-gray-800 dark:text-gray-200"
                                    id="detail-prop-lazy">FALSE</span>
                            </div>
                            <div class="flex justify-between items-center text-xs">
                                <span class="text-gray-500 dark:text-gray-400">Autowired Candidate</span>
                                <span class="font-bold text-gray-800 dark:text-gray-200"
                                    id="detail-prop-autowired">TRUE</span>
                            </div>
                            <div class="flex justify-between items-center text-xs">
                                <span class="text-gray-500 dark:text-gray-400">Context ID</span>
                                <span class="font-bold text-gray-800 dark:text-gray-200 font-mono text-[10px]"
                                    id="detail-prop-context">-</span>
                            </div>
                        </div>
                    </div>

                    <!-- Factory Details Section -->
                    <div
                        class="bg-gray-50/70 dark:bg-slate-800/40 border border-gray-100 dark:border-slate-800 rounded-lg p-3 space-y-2.5">
                        <h4 class="text-[11px] font-bold text-gray-800 dark:text-white">Factory Details</h4>
                        <div class="space-y-2">
                            <div>
                                <span class="text-[10px] text-gray-500 dark:text-gray-400 block mb-0.5">Factory
                                    Bean</span>
                                <span
                                    class="text-[10px] font-mono text-gray-800 dark:text-gray-300 break-all leading-normal"
                                    id="detail-factory-bean">-</span>
                            </div>
                            <div>
                                <span class="text-[10px] text-gray-500 dark:text-gray-400 block mb-0.5">Factory
                                    Method</span>
                                <span class="text-xs font-bold text-gray-800 dark:text-gray-200"
                                    id="detail-factory-method">-</span>
                            </div>
                        </div>
                    </div>

                    <!-- Lifecycle Section -->
                    <div>
                        <h4 class="text-[11px] font-bold text-gray-800 dark:text-white mb-2">Lifecycle</h4>
                        <div class="space-y-2">
                            <div class="flex justify-between items-center text-xs">
                                <span class="text-gray-500 dark:text-gray-400">Init Method</span>
                                <span class="font-bold text-gray-800 dark:text-gray-200 font-mono text-[10px]"
                                    id="detail-init-method">-</span>
                            </div>
                            <div class="flex justify-between items-center text-xs">
                                <span class="text-gray-500 dark:text-gray-400">Destroy Method</span>
                                <span class="font-bold text-gray-800 dark:text-gray-200 font-mono text-[10px]"
                                    id="detail-destroy-method">-</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Tab Pane: Dependencies -->
                <div id="pane-dependencies" class="tab-pane hidden space-y-2">
                    <div id="detail-deps-list" class="divide-y divide-gray-50 dark:divide-slate-800 text-xs">
                        <!-- Dynamically populated -->
                    </div>
                </div>

                <!-- Tab Pane: Dependents -->
                <div id="pane-dependents" class="tab-pane hidden space-y-2">
                    <div id="detail-dependents-list" class="divide-y divide-gray-50 dark:divide-slate-800 text-xs">
                        <!-- Dynamically populated -->
                    </div>
                </div>
            </div>

            <!-- Optional Footer Container -->
            <div id="sidebar-footer-container"></div>
        </div>
    </template>

    <script src="./src/lib/d3.v7.min.js"></script>
    <script src="./src/lib/chart-4.5.1.min.js"></script>
    <script type="module" src="./script.js"></script>
</body>

</html>
