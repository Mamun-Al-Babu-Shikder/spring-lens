<div class="flex-1 overflow-auto custom-scrollbar p-4 sm:p-6 flex flex-col gap-6 h-full min-h-0">
    <!-- Stats Banner -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 sm:gap-6 flex-shrink-0">
        <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-gray-200 dark:border-slate-800 shadow-sm flex items-center gap-4 transition-colors duration-300">
            <div class="w-12 h-12 rounded-xl bg-primary/10 dark:bg-primary/20 text-primary flex items-center justify-center">
                <span class="material-symbols-outlined text-[28px]">api</span>
            </div>
            <div>
                <span class="text-xs font-medium text-gray-400 dark:text-gray-500 block uppercase tracking-wider">Unique Routes</span>
                <span class="text-2xl font-bold text-gray-800 dark:text-gray-100" id="ep-routes-count">-</span>
            </div>
        </div>
        <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-gray-200 dark:border-slate-800 shadow-sm flex items-center gap-4 transition-colors duration-300">
            <div class="w-12 h-12 rounded-xl bg-success-light dark:bg-success/15 text-success flex items-center justify-center">
                <span class="material-symbols-outlined text-[28px]">insights</span>
            </div>
            <div>
                <span class="text-xs font-medium text-gray-400 dark:text-gray-500 block uppercase tracking-wider">Most Active Endpoint</span>
                <span class="text-lg font-bold text-gray-800 dark:text-gray-100 truncate max-w-[200px]" id="ep-active-route" style="display: block;">-</span>
            </div>
        </div>
        <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-gray-200 dark:border-slate-800 shadow-sm flex items-center gap-4 transition-colors duration-300">
            <div class="w-12 h-12 rounded-xl bg-warning/10 dark:bg-warning/15 text-warning flex items-center justify-center">
                <span class="material-symbols-outlined text-[28px]">hourglass_empty</span>
            </div>
            <div>
                <span class="text-xs font-medium text-gray-400 dark:text-gray-500 block uppercase tracking-wider">Slowest Avg Latency</span>
                <span class="text-lg font-bold text-gray-800 dark:text-gray-100" id="ep-slowest-route">-</span>
            </div>
        </div>
    </div>

    <!-- Table Section -->
    <div class="bg-white dark:bg-slate-900 border border-gray-200 dark:border-slate-800 rounded-2xl shadow-sm flex flex-col flex-1 min-h-[360px] overflow-hidden transition-colors duration-300">
        <div class="p-5 border-b border-gray-100 dark:border-slate-800 flex flex-col md:flex-row md:items-center justify-between gap-4 flex-shrink-0">
            <div class="relative max-w-sm w-full">
                <span class="material-symbols-outlined absolute left-3 top-2.5 text-gray-400 dark:text-gray-500 text-[18px]">search</span>
                <input type="text" id="endpoint-search" placeholder="Search endpoints..." class="w-full pl-10 pr-4 py-2 bg-gray-50 dark:bg-slate-950 border border-gray-200 dark:border-slate-800 text-gray-850 dark:text-gray-100 rounded-lg text-sm focus:outline-none focus:border-primary placeholder-gray-400 dark:placeholder-gray-500 transition-colors">
            </div>
            <div id="endpoint-pagination-info" class="text-xs font-semibold text-gray-400 dark:text-gray-500">
                <!-- Pagination / counts info -->
            </div>
        </div>

        <div class="flex-1 min-h-0 overflow-auto custom-scrollbar">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b border-gray-100 dark:border-slate-800 text-[10px] font-bold text-gray-400 dark:text-gray-500 uppercase tracking-wider bg-gray-50/50 dark:bg-slate-800/40 sticky top-0 z-10">
                        <th class="px-6 py-3.5">Method</th>
                        <th class="px-6 py-3.5">Route</th>
                        <th class="px-6 py-3.5 text-center">Hit Count</th>
                        <th class="px-6 py-3.5 text-center">Avg Latency</th>
                        <th class="px-6 py-3.5 text-center">Max Latency</th>
                        <th class="px-6 py-3.5">Service</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-100 dark:divide-slate-800" id="endpointTableBody">
                    <!-- Dynamic rows here -->
                </tbody>
            </table>
        </div>
    </div>
</div>
